  <h1>🧱 Brick Breaker</h1>

  <p>Score: <strong id="score">0</strong></p>

  <canvas id="gameCanvas" width="480" height="400"></canvas>

  <p>Use ← → keys to move.</p>

  <button onclick="startGame()">Start Game</button>

  <script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let ball;
    let paddle;
    let bricks;
    let dx;
    let dy;
    let score;
    let game;

    const brickRows = 5;
    const brickCols = 8;

    function startGame() {

      clearInterval(game);

      score = 0;

      document.getElementById("score").textContent = score;

      ball = {
        x: canvas.width / 2,
        y: canvas.height - 50,
        r: 8
      };

      paddle = {
        x: canvas.width / 2 - 50,
        y: canvas.height - 20,
        width: 100,
        height: 10,
        speed: 7
      };

      dx = 4;
      dy = -4;

      createBricks();

      game = setInterval(updateGame, 16);
    }

    function createBricks() {

      bricks = [];

      for (let row = 0; row < brickRows; row++) {

        for (let col = 0; col < brickCols; col++) {

          bricks.push({
            x: col * 60 + 5,
            y: row * 25 + 30,
            width: 55,
            height: 20,
            alive: true
          });

        }
      }
    }

    let left = false;
    let right = false;

    document.addEventListener("keydown", function(e) {

      if (e.key === "ArrowLeft") left = true;
      if (e.key === "ArrowRight") right = true;

    });

    document.addEventListener("keyup", function(e) {

      if (e.key === "ArrowLeft") left = false;
      if (e.key === "ArrowRight") right = false;

    });

    function updateGame() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Paddle
      if (left) paddle.x -= paddle.speed;
      if (right) paddle.x += paddle.speed;

      if (paddle.x < 0) paddle.x = 0;

      if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
      }

      ctx.fillStyle = "blue";

      ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
      );

      // Bricks
      for (let brick of bricks) {

        if (!brick.alive) continue;

        ctx.fillStyle = "orange";

        ctx.fillRect(
          brick.x,
          brick.y,
          brick.width,
          brick.height
        );
      }

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();
      ctx.closePath();

      ball.x += dx;
      ball.y += dy;

      // Walls
      if (ball.x + ball.r > canvas.width ||
          ball.x - ball.r < 0) {
        dx = -dx;
      }

      if (ball.y - ball.r < 0) {
        dy = -dy;
      }

      // Paddle collision
      if (
        ball.y + ball.r >= paddle.y &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        dy = -Math.abs(dy);
      }

      // Brick collision
      for (let brick of bricks) {

        if (!brick.alive) continue;

        if (
          ball.x > brick.x &&
          ball.x < brick.x + brick.width &&
          ball.y > brick.y &&
          ball.y < brick.y + brick.height
        ) {

          brick.alive = false;

          dy = -dy;

          score++;

          document.getElementById("score").textContent = score;
        }
      }

      // Win
      if (score === brickRows * brickCols) {

        clearInterval(game);

        alert("You Win! 🎉");

      }

      // Game over
      if (ball.y > canvas.height) {

        clearInterval(game);

        alert("Game Over! Score: " + score);

      }
    }

  </script>

</body>
